name: ci

# The fast lane. `npm test` runs `tsc` through `pretest` and then the
# description-budget fixtures — the typecheck is most of the value, since the
# CLI is TypeScript and nothing else compiles it before a merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test
